services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: fudo
      POSTGRES_PASSWORD: fudo
      POSTGRES_DB: fudo_development
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fudo"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
