name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    name: RuboCop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true # Ruby version from .ruby-version, gems cached between runs
      - run: bundle exec rubocop

  test:
    name: RSpec
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fudo
          POSTGRES_PASSWORD: fudo
          POSTGRES_DB: fudo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fudo -d fudo_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      RACK_ENV: test
      TEST_DATABASE_URL: postgres://fudo:fudo@localhost:5432/fudo_test
      # Specs keep Sidekiq jobs in memory, so Redis is required by the config but never contacted.
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-only-secret-at-least-32-characters-long
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - run: bundle exec rake db:migrate
      - run: bundle exec rspec
